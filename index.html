<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevents browser viewport zoom while typing on mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart PDF Mobile Editor</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --border: #334155;
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      height: 100dvh; 
      overflow: hidden; 
    }

    /* Fixed App Bar */
    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      z-index: 100;
    }
    .btn-group { display: flex; align-items: center; gap: 0.4rem; }
    button, label.btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active, label.btn:active { background: #0369a1; }
    button.save-btn { background: #16a34a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input[type="file"] { display: none; }
    .page-info { font-size: 0.85rem; color: #94a3b8; min-width: 60px; text-align: center; }

    /* PDF Viewport */
    #viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1rem 0.5rem;
      background: #090d16;
    }
    .page-container {
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      background: #fff;
      touch-action: pan-x pan-y;
    }
    canvas { display: block; width: 100% !important; height: auto !important; }

    /* Interactive Text Layer */
    .textLayer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      line-height: 1.0;
    }
    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: pointer;
      transform-origin: 0% 0%;
    }
    .textLayer span:active {
      background: rgba(56, 189, 248, 0.35);
      border: 1px dashed #38bdf8;
    }

    /* Mobile Text Edit Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-box h3 { font-size: 1rem; margin-bottom: 0.75rem; color: var(--accent); }
    .modal-box input {
      width: 100%;
      font-size: 1rem; /* 16px font prevents iOS/Android auto-zoom */
      padding: 0.6rem 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      margin-bottom: 1rem;
      outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; }
    .btn-cancel { background: #475569; }

    /* Visual replacement overlay */
    .applied-mask {
      position: absolute;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      white-space: pre;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="btn-group">
      <label class="btn" for="pdf-upload">📂 Open</label>
      <input type="file" id="pdf-upload" accept="application/pdf" />

      <button id="prev-page" disabled>◀</button>
      <span id="page-num-display" class="page-info">- / -</span>
      <button id="next-page" disabled>▶</button>
    </div>

    <button id="save-btn" class="save-btn" disabled>💾 Save</button>
  </div>

  <div id="viewport">
    <div id="page-wrapper" class="page-container" style="display: none;">
      <canvas id="pdf-canvas"></canvas>
      <div id="text-layer" class="textLayer"></div>
    </div>
  </div>

  <!-- Mobile-Friendly Pop-up Text Editor -->
  <div id="edit-modal" class="modal-backdrop">
    <div class="modal-box">
      <h3>Edit Text</h3>
      <input type="text" id="modal-input" placeholder="Type new text..." />
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn-cancel">Cancel</button>
        <button id="modal-apply-btn">Apply</button>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rawPdfBytes = null;
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let currentScale = 1.5;
    let allPageEdits = {}; // Key: pageIndex -> Array of edits

    let activeEditTarget = null;

    const fileInput = document.getElementById('pdf-upload');
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('page-wrapper');
    const textLayer = document.getElementById('text-layer');
    const pageNumDisplay = document.getElementById('page-num-display');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const saveBtn = document.getElementById('save-btn');

    const editModal = document.getElementById('edit-modal');
    const modalInput = document.getElementById('modal-input');
    const modalCancel = document.getElementById('modal-cancel-btn');
    const modalApply = document.getElementById('modal-apply-btn');

    // 1. Load PDF Document
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      rawPdfBytes = await file.arrayBuffer();
      pdfDoc = await pdfjsLib.getDocument({ data: rawPdfBytes.slice(0) }).promise;
      
      totalPages = pdfDoc.numPages;
      currentPage = 1;
      allPageEdits = {};
      
      saveBtn.disabled = false;
      renderPage(currentPage);
    });

    // 2. Render Page Canvas & Interactive Text Layer
    async function renderPage(pageNum) {
      updateNavControls();
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: currentScale });

      canvas.width = viewport.width;
      canvas.height = viewport.height;
      wrapper.style.width = `${viewport.width}px`;
      wrapper.style.height = `${viewport.height}px`;
      wrapper.style.display = 'block';

      // Clear previous overlay & masks
      textLayer.innerHTML = '';
      document.querySelectorAll('.applied-mask').forEach(el => el.remove());

      await page.render({ canvasContext: ctx, viewport }).promise;

      // Extract Text Layer
      const textContent = await page.getTextContent();
      textContent.items.forEach((item) => {
        if (!item.str.trim()) return;
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontHeight = Math.sqrt((tx[2] * tx[2]) + (tx[3] * tx[3]));

        const span = document.createElement('span');
        span.textContent = item.str;
        span.style.fontSize = `${fontHeight}px`;
        span.style.fontFamily = item.fontName || 'sans-serif';
        span.style.left = `${tx[4]}px`;
        span.style.top = `${tx[5] - fontHeight}px`;
        span.style.height = `${fontHeight}px`;

        // Single click or tap to edit (mobile friendly)
        span.addEventListener('click', (e) => {
          e.stopPropagation();
          openMobileEditor({
            span,
            left: tx[4],
            top: tx[5] - fontHeight,
            fontHeight,
            pageIndex: currentPage,
            originalText: item.str
          });
        });

        textLayer.appendChild(span);
      });

      // Restore previously saved visual edits for this page
      if (allPageEdits[currentPage]) {
        allPageEdits[currentPage].forEach(drawVisualMask);
      }
    }

    // 3. Mobile Text Input Modal Handlers
    function openMobileEditor(targetData) {
      activeEditTarget = targetData;
      modalInput.value = targetData.span.textContent.trim();
      editModal.style.display = 'flex';
      setTimeout(() => {
        modalInput.focus();
        modalInput.select();
      }, 50);
    }

    modalCancel.onclick = () => {
      editModal.style.display = 'none';
      activeEditTarget = null;
    };

    modalApply.onclick = () => {
      if (!activeEditTarget) return;
      const newText = modalInput.value;
      const { left, top, fontHeight, span, pageIndex } = activeEditTarget;

      const spanRect = span.getBoundingClientRect();
      const wrapperRect = wrapper.getBoundingClientRect();
      const calculatedWidth = (spanRect.width / wrapperRect.width) * canvas.width;

      const editData = {
        left,
        top,
        width: Math.max(calculatedWidth + 6, 40),
        height: fontHeight + 3,
        fontSize: fontHeight,
        text: newText,
        pageIndex
      };

      if (!allPageEdits[pageIndex]) allPageEdits[pageIndex] = [];
      allPageEdits[pageIndex].push(editData);

      drawVisualMask(editData);
      span.textContent = newText;

      editModal.style.display = 'none';
      activeEditTarget = null;
    };

    function drawVisualMask(edit) {
      const mask = document.createElement('div');
      mask.className = 'applied-mask';
      mask.style.left = `${edit.left}px`;
      mask.style.top = `${edit.top}px`;
      mask.style.width = `${edit.width}px`;
      mask.style.height = `${edit.height}px`;
      mask.style.fontSize = `${edit.fontSize}px`;
      mask.innerText = edit.text;
      wrapper.appendChild(mask);
    }

    // 4. Multi-Page Navigation
    function updateNavControls() {
      pageNumDisplay.textContent = `${currentPage} / ${totalPages}`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    prevBtn.onclick = () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage(currentPage);
      }
    };

    nextBtn.onclick = () => {
      if (currentPage < totalPages) {
        currentPage++;
        renderPage(currentPage);
      }
    };

    // 5. Export All Pages with Edits
    saveBtn.onclick = async () => {
      if (!rawPdfBytes) return;

      const { PDFDocument, rgb, StandardFonts } = PDFLib;
      const pdfLibDoc = await PDFDocument.load(rawPdfBytes.slice(0));
      const helvetica = await pdfLibDoc.embedFont(StandardFonts.Helvetica);
      const pages = pdfLibDoc.getPages();

      Object.keys(allPageEdits).forEach((pNum) => {
        const pageIdx = parseInt(pNum, 10) - 1;
        const page = pages[pageIdx];
        const pageHeight = page.getHeight();
        const edits = allPageEdits[pNum];

        edits.forEach((item) => {
          // Convert viewport canvas coordinates back to native PDF units
          const pdfX = item.left / currentScale;
          const pdfY = (pageHeight - (item.top / currentScale) - (item.height / currentScale));
          const pdfWidth = item.width / currentScale;
          const pdfHeight = item.height / currentScale;
          const pdfFontSize = (item.fontSize / currentScale) * 0.95;

          // Whiteout old text
          page.drawRectangle({
            x: pdfX,
            y: pdfY,
            width: pdfWidth,
            height: pdfHeight,
            color: rgb(1, 1, 1),
          });

          // Draw replacement text
          page.drawText(item.text, {
            x: pdfX,
            y: pdfY + (pdfFontSize * 0.2),
            size: pdfFontSize,
            font: helvetica,
            color: rgb(0, 0, 0),
          });
        });
      });

      const modifiedBytes = await pdfLibDoc.save();
      const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
      const downloadLink = document.createElement('a');
      downloadLink.href = URL.createObjectURL(blob);
      downloadLink.download = 'edited_document.pdf';
      downloadLink.click();
    };
  </script>
</body>
</html>
